name: Deploy Docs and React App to GitHub Pages

# Builds the Zensical documentation site (docs/ = OKF v0.2 bundle, pre-rendered
# notebooks, raw Markdown twins, llms.txt) together with the React app under
# /react, publishes it to GitHub Pages, then smoke-tests the live URLs.
# The same pipeline runs on pull requests in test-build.yaml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site (Zensical + React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      - name: Install the docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react/package-lock.json

      # okf export --check -> stage okf/ -> render_notebooks --check -> validate_okf x3
      # -> zensical build --strict -> publish_sources (twins) -> generate_llms_txt --strict
      # -> npm ci/type-check/lint/build + copy react/build -> site/react -> check_site
      - name: Build the site
        run: bash scripts/build_site.sh --with-react --ci

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Smoke-test the live site
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ~25 curls: home, one page per tab, notebook pages, llms.txt, llms-full.txt,
      # robots.txt, sitemap, Markdown twins (text/markdown), /react/, a redirect stub.
      - name: Run the live smoke test
        run: bash scripts/smoke_live.sh
