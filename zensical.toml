[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
name = "material"
variant = "classic"
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.png"
icon = { logo = "material/family-tree", repo = "fontawesome/brands/github" }
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.font]
text = "EB Garamond"
code = "Courier Prime"

# Light: custom "fractals" scheme (colours in docs/stylesheets/extra.css). Dark: slate.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "fractals"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.extra]
# Sibling OKF bundles / llms.txt files advertised in site/llms.txt
# (consumed by scripts/generate_llms_txt.py as "Related OKF bundle:" lines).
related_llms = [
  "https://tyson-swetnam.github.io/okf/index.md",
  "https://tyson-swetnam.github.io/intro-gpt/llms.txt",
  "https://tyson-swetnam.github.io/energetics-pymol/llms.txt",
  "https://tyson-swetnam.github.io/cod-kmap/llms.txt",
]

# Frontmatter `status:` renders an .md-status span next to the nav entry; the
# "stable" badge is hidden in extra.css so only drafts are marked.
[project.extra.status]
stable = "Stable"
draft = "Draft"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/tyson-swetnam/"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/@PrometheanGift"

# mkdocs.yml's extension set minus pymdownx.magiclink (misconfigured, unused) and
# pymdownx.critic (unused), plus pymdownx.emoji so the :material-...: shortcodes
# on the home page render. Prune further only with compare_builds.py evidence.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
meta = {}
toc.permalink = true
toc.title = "On this page"
pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# Redirects (native plugin; search is native and on by default). Keys are
# docs-relative source paths of the OLD page (they become /old/ stubs with a
# canonical link + meta refresh + JS that forwards #anchors); values are
# docs-relative .md paths, optionally with #anchor, or absolute URLs. A key of
# the form "page.md#old-anchor" on a page that still exists is served
# client-side through redirect.json. Gate: every URL in
# scripts/fixtures/live-urls-2026-10-24.txt resolves to a page or a stub
# (scripts/check_site.py; `--emit-redirects` prints any missing entry).
