# Zensical configuration for "Fractal Self-Affinity in Nature"
# https://tyson-swetnam.github.io/fractal-notebooks  (replaces mkdocs.yml)
#
# TOML gotcha: bare keys attach to the most recent [table] header, so every
# [project] key (nav, extra_css, exclude_docs, ...) must appear BEFORE the first
# [project.*] / [[project.*]] header.
#
# Build: bash scripts/build_site.sh  (stage okf/ -> render notebooks -> validate
# OKF -> zensical build --strict -> publish raw .md twins -> llms.txt -> checks).
# scripts/okf_common.py reads site_url, nav, exclude_docs and not_in_nav from
# this file, so keep them here rather than in script defaults. See CLAUDE.md.

[project]
site_name = "Fractal Self-Affinity in Nature"
site_url = "https://tyson-swetnam.github.io/fractal-notebooks"
site_description = "Self-affine fractals, metabolic scaling theory and the geometry of biological systems: tutorial chapters on fractal foundations, four research manuscripts, pre-rendered Jupyter notebooks, interactive apps, and OKF knowledge bundles of fractal concepts and proofs."
site_author = "Tyson L. Swetnam"
copyright = "Copyright &copy; 2025 The University of Arizona &mdash; content licensed <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a>"
repo_url = "https://github.com/tyson-swetnam/fractal-notebooks"
repo_name = "tyson-swetnam/fractal-notebooks"
# Trailing slash: overrides/main.html derives each page's Markdown twin from
# page.edit_url by stripping "<repo_url>/edit/main/docs/".
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
strict = true

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# gitignore syntax, one pattern per line. Notebook sources (.ipynb), helper
# scripts, data files, READMEs and internal planning notes stay in the repo but
# are never built; the research notebook directories are listed with GitHub and
# nbviewer links on notebooks/research.md instead. Every URL that disappears
# here has a redirect in [project.plugins.redirects.redirect_maps] below.
exclude_docs = """
*.ipynb
*.py
*.yaml
*.yml
*.geojson
*.json
*.npz
*.csv
.DS_Store
/notebooks/3dep/
/notebooks/sierra-nevada/
/notebooks/smithsonian/
/notebooks/metabolic-scaling/review/
/notebooks/foundations/blender/
README.md
PLAN*.md
*_claude.md
*_plan.md
ANALYSIS_AND_FIXES.md
PROPOSED_FIX.md
"""
# Pages that are built and published but hidden from the sidebar until they are
# ready (none at the moment; same gitignore syntax as exclude_docs).
draft_docs = ""
# Built and published, but not listed in the navigation: the change log and the
# OKF concept pages + group indexes, which are browsed through okf/concepts/index.md
# (progressive disclosure; the nav does not drift when the seed grows).
not_in_nav = """
/log.md
/okf/concepts/*/
/okf/*/log.md
"""

