# Manifest of the Jupyter notebooks published as pre-rendered pages.
#
# scripts/render_notebooks.py turns every [[notebook]] below into
# docs/<dir>/<stem>.md + docs/<dir>/<stem>_files/ (both committed; CI drift-checks
# them with --check). Publishing a notebook = add an entry here + a nav entry in
# zensical.toml, run `python scripts/render_notebooks.py`, commit the output.
#
# Per-entry keys
#   src             notebook path relative to the repo root (must be under docs/)
#   title           frontmatter title (disambiguated; the body H1 is left as-is)
#   description     50-300 chars of plain text, no " < > — becomes the meta
#                   description and the llms.txt entry
#   tags            2-6 tags from the vocabulary in scripts/validate_okf.py
#   companion_page  site-relative URL path of the chapter/section the notebook
#                   supports (optional)
#   environment     how to run it (free text, shown in the banner)
#   as_of           date of the notebook's last commit (YYYY-MM-DD); it becomes
#                   generated.at and the "as of" date in the banner. The renderer
#                   never calls git, so update this by hand when re-committing a
#                   re-executed notebook: git log -1 --format=%cs -- <src>
#   status          stable | draft (default: [defaults].status)
#   code_only       true -> drop every output (pages for notebooks that need a
#                   live service, e.g. the Fractal RAG examples)
#   heading         H1 text to inject when the notebook has no usable H1
#   h1_policy       keep (default: first H1 kept, extra H1s demoted) |
#                   replace (first H1 replaced by `heading`/title) |
#                   demote (all H1s demoted, `heading`/title injected on top)
#   verified_at     YYYY-MM-DD of a human review -> emits verified[{by: author}];
#                   leave unset until a person has re-read the rendered page

[defaults]
author = "human:tswetnam"
status = "stable"
max_stream_lines = 120
# Used only when zensical.toml is absent (or --config is not given); the site
# configuration wins when present.
site_url = "https://tyson-swetnam.github.io/fractal-notebooks"
repo_url = "https://github.com/tyson-swetnam/fractal-notebooks"
branch = "main"

