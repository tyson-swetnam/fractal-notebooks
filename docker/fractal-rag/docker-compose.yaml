# Local Fractal RAG stack — single-node Weaviate + a CPU text2vec-transformers
# sidecar. No GPU required. Brings up two services:
#
#   weaviate           http://localhost:8080  (REST), localhost:50051 (gRPC)
#   t2v-transformers   internal-only; Weaviate calls it via TRANSFORMERS_INFERENCE_API
#
# Quickstart:
#   docker compose -f docker/fractal-rag/docker-compose.yaml up -d
#   FRACTAL_RAG_WEAVIATE_HTTP_PORT=8080 fractal-rag schema bootstrap
#   FRACTAL_RAG_WEAVIATE_HTTP_PORT=8080 fractal-rag ingest --source docs

version: "3.8"

services:
  weaviate:
    image: semitechnologies/weaviate:1.35.0
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "100"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      ENABLE_MODULES: "text2vec-transformers"
      DEFAULT_VECTORIZER_MODULE: "text2vec-transformers"
      TRANSFORMERS_INFERENCE_API: "http://t2v-transformers:8080"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate-data:/var/lib/weaviate
    depends_on:
      - t2v-transformers

  # CPU-only embedder. Swap the image tag for a larger model if you have RAM.
  # `baai-bge-small-en-v1.5` is ~135 MB and fast enough for laptops; use the
  # same `snowflake-arctic-embed-l-v2.0` tag from k3s-deployment/ if you have
  # a GPU and add `runtime: nvidia` + `ENABLE_CUDA: "1"`.
  t2v-transformers:
    image: cr.weaviate.io/semitechnologies/transformers-inference:baai-bge-small-en-v1.5
    restart: unless-stopped
    environment:
      ENABLE_CUDA: "0"

volumes:
  weaviate-data:
