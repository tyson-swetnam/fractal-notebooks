# Seed concepts for the Concept side-collection.
# Drawn from docs/glossary.md and docs/foundations/glossary.md.
# Each entry: name (canonical), aliases (matched case-insensitive, longest first),
# definition (one-paragraph), domain (tags), hausdorff_dim_range (optional [lo, hi]).

- name: Fractal
  aliases: [fractals]
  definition: >-
    A complex geometric shape exhibiting self-similarity (or self-affinity) at
    multiple scales, characterized by a non-integer fractal dimension and often
    generated by recursive or iterative processes.
  domain: [geometry, foundations]

- name: Self-Similarity
  aliases: [self-similar, self similarity]
  definition: >-
    Property of a fractal that appears the same (up to uniform isotropic
    scaling) when zoomed into any of its parts.
  domain: [geometry, foundations]

- name: Self-Affinity
  aliases: [self-affine, self affinity]
  definition: >-
    Property of a fractal that resembles itself under anisotropic scaling
    (different scaling factors along different axes). Generalization of
    self-similarity.
  domain: [geometry, foundations]

- name: Fractal Dimension
  aliases: [fractal dimensions]
  definition: >-
    A real-valued (often non-integer) measure of how the detail of a pattern
    changes with the scale at which it is measured.
  domain: [dimension-theory, foundations]

- name: Hausdorff Dimension
  aliases: [hausdorff-besicovitch dimension, hausdorff measure]
  definition: >-
    Rigorous notion of dimension defined as the infimum of d such that the
    d-dimensional Hausdorff measure of the set is zero.
  domain: [dimension-theory, measure-theory]

- name: Box-Counting Dimension
  aliases: [box counting, minkowski dimension, box-counting]
  definition: >-
    Estimated fractal dimension obtained by covering a set with boxes of edge
    epsilon and measuring how the count N(epsilon) scales as epsilon -> 0.
  domain: [dimension-theory, methods]

- name: Differential Box-Counting
  aliases: [dbc, differential box counting]
  definition: >-
    Extension of box-counting for grayscale images that partitions the
    intensity axis to estimate the fractal dimension of textured surfaces.
  domain: [dimension-theory, image-analysis, methods]

- name: Mandelbrot Set
  aliases: [mandelbrot]
  definition: >-
    Set of complex numbers c for which the orbit of 0 under z -> z^2 + c
    remains bounded. Its boundary is a quintessential 2D fractal.
  domain: [complex-dynamics, classics]
  hausdorff_dim_range: [2.0, 2.0]

- name: Julia Set
  aliases: [julia sets, julia]
  definition: >-
    Set of complex numbers for which a given iterated holomorphic function
    (typically z -> z^2 + c for fixed c) has chaotic behavior. Closely related
    to the Mandelbrot set.
  domain: [complex-dynamics, classics]

- name: Cantor Set
  aliases: [cantor, cantor dust]
  definition: >-
    Classical fractal constructed by iteratively removing the middle third of
    a line segment. Totally disconnected, perfect, of measure zero.
  domain: [classics, dimension-theory]
  hausdorff_dim_range: [0.6309, 0.6309]

- name: Sierpinski Triangle
  aliases: [sierpinski gasket, sierpinski]
  definition: >-
    Self-similar fractal formed by recursively removing the central triangle
    from an equilateral triangle.
  domain: [classics, ifs]
  hausdorff_dim_range: [1.585, 1.585]

- name: Koch Curve
  aliases: [koch snowflake, koch]
  definition: >-
    Continuous, nowhere-differentiable fractal curve built by recursively
    replacing each line segment with a four-segment 'bump'.
  domain: [classics, ifs]
  hausdorff_dim_range: [1.2619, 1.2619]

- name: Menger Sponge
  aliases: [menger]
  definition: >-
    Three-dimensional generalization of the Cantor set and Sierpinski carpet
    obtained by iterative subdivision and removal of central cubes.
  domain: [classics, 3d-fractals]
  hausdorff_dim_range: [2.7268, 2.7268]

- name: Barnsley Fern
  aliases: [barnsley, barnsleys fern]
  definition: >-
    Iterated function system (IFS) of four affine maps that produces a
    fern-like attractor and is a classic biological-fractal example.
  domain: [ifs, biological]

- name: Iterated Function System
  aliases: [ifs, iterated function systems]
  definition: >-
    Finite collection of contraction mappings on a complete metric space whose
    attractor is a (typically fractal) compact set, by the Hutchinson theorem.
  domain: [ifs, foundations]

- name: L-System
  aliases: [l-systems, lindenmayer system]
  definition: >-
    Parallel string-rewriting grammar (Lindenmayer system) used to model
    branching biological structures such as plants, algae, and trees.
  domain: [generative, biological, branching]

- name: Diffusion-Limited Aggregation
  aliases: [dla, diffusion limited aggregation]
  definition: >-
    Stochastic growth process in which particles undergoing Brownian motion
    cluster together, producing fractal aggregates with characteristic
    dendritic branching.
  domain: [stochastic, branching, biological]
  hausdorff_dim_range: [1.7, 1.7]

- name: Brownian Motion
  aliases: [brownian, wiener process]
  definition: >-
    Continuous-time stochastic process with stationary independent Gaussian
    increments. Its sample paths are fractal curves of Hausdorff dimension 2
    in the plane.
  domain: [stochastic, foundations]

- name: Fractional Brownian Motion
  aliases: [fbm, fractional brownian]
  definition: >-
    Generalization of Brownian motion governed by a Hurst exponent H in (0,1)
    that controls long-range dependence and the roughness of sample paths.
  domain: [stochastic, hurst]

- name: Hurst Exponent
  aliases: [hurst, hurst-exponent, h-exponent]
  definition: >-
    Parameter H in (0,1) characterizing long-range dependence and the
    roughness/persistence of a time series; relates to fractal dimension via
    D = 2 - H for 1D signals.
  domain: [stochastic, dimension-theory]

- name: Pink Noise
  aliases: [1/f noise, flicker noise]
  definition: >-
    Random signal whose power spectral density is inversely proportional to
    frequency; a 1D fractal noise widely observed in natural systems.
  domain: [stochastic, signal-processing]

- name: Lacunarity
  aliases: []
  definition: >-
    Measure of how a fractal fills space, quantifying gap-size distribution.
    Distinguishes textures with the same fractal dimension but different
    'gappiness'.
  domain: [dimension-theory, texture]

- name: Riemann Zeta Function
  aliases: [zeta function, riemann zeta]
  definition: >-
    Complex analytic function zeta(s) = sum_{n>=1} 1/n^s, central to number
    theory; its non-trivial zeros lie (conjecturally) on the critical line
    Re(s) = 1/2.
  domain: [number-theory, complex-analysis, foundations]

- name: Complex Dimensions
  aliases: [complex fractal dimension]
  definition: >-
    Generalization of the real Hausdorff/box-counting dimension to complex
    values, used by Lapidus et al. to describe oscillatory geometric and
    spectral asymptotics of fractal sets.
  domain: [dimension-theory, complex-analysis, advanced]

- name: Power Law
  aliases: [power-law, scaling law, scaling laws]
  definition: >-
    Functional relationship y = c x^alpha; ubiquitous in fractal scaling,
    allometry, and self-organized criticality.
  domain: [foundations, statistics]

- name: Allometry
  aliases: [allometric, allometric scaling]
  definition: >-
    Study of how parts of an organism scale with overall body size, often
    following power-law relationships such as Kleiber's 3/4-power metabolic
    law.
  domain: [biological, scaling]

- name: Multi-Fractal
  aliases: [multifractal, multi-fractals, multifractals]
  definition: >-
    Generalization of fractal geometry in which different regions of a set
    exhibit different local scaling exponents, characterized by a spectrum
    f(alpha).
  domain: [dimension-theory, advanced]

- name: Percolation Theory
  aliases: [percolation]
  definition: >-
    Branch of statistical physics that studies connectivity in random media,
    near the critical threshold producing fractal clusters.
  domain: [stochastic, statistical-physics]

- name: Attractor
  aliases: [strange attractor]
  definition: >-
    Set toward which a dynamical system tends; in chaotic systems the
    attractor often has fractal structure (a 'strange' attractor).
  domain: [dynamics, foundations]

- name: Self-Organized Criticality
  aliases: [soc]
  definition: >-
    Property of dynamical systems that naturally evolve toward critical states
    where small perturbations produce avalanches of all sizes, often with
    fractal spatial structure.
  domain: [statistical-physics, advanced]

- name: Topological Dimension
  aliases: [topological-dimension, covering dimension]
  definition: >-
    Integer-valued dimension defined via open covers (Lebesgue covering
    dimension). Contrasted with fractal dimension; for true fractals,
    Hausdorff dimension exceeds topological dimension.
  domain: [dimension-theory, topology, foundations]
