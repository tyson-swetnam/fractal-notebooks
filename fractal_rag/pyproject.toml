[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fractal-rag"
version = "0.1.0"
description = "Weaviate-backed RAG stack for the Fractal Notebooks research corpus"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Tyson Swetnam", email = "tswetnam@arizona.edu" }]
dependencies = [
    "weaviate-client>=4.9,<5",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "click>=8.1",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "nbformat>=5.10",
    "mistune>=3.0",
    "tqdm>=4.66",
    "tenacity>=8.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
pdf = ["pdfminer.six>=20240706"]
parsers = ["pdfminer.six>=20240706"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[weaviate]>=4.7",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
fractal-rag = "fractal_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running Weaviate instance (testcontainers)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
