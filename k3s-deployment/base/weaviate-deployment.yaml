apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  namespace: ai-workloads
  labels:
    app: weaviate
spec:
  replicas: 1
  # One pod on a ReadWriteOnce local-path volume: stop the old pod before starting the new one,
  # otherwise a rolling update mounts the data directory twice on the same node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
        - name: weaviate
          # 1.35.3+ is required: 1.35.0 writes a NaN average property length for a segment
          # flush that only holds deletions (weaviate/weaviate#10102), which zeroes every BM25
          # score on the affected properties after a bulk delete.
          image: semitechnologies/weaviate:1.35.23
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 50051
          env:
            # Pin the Raft node name. Without it Weaviate names the node after the pod, and a
            # re-created pod (new name) can never rejoin its own single-node cluster: it retries
            # for RAFT_BOOTSTRAP_TIMEOUT seconds and exits. The recovery flag lets a node whose
            # name changed (a pod created before this setting existed) rewrite the stored
            # single-voter configuration to itself. Choose the name before the first ingest and
            # never change it: Weaviate also records the owning node name in each shard's
            # metadata, and the recovery renames only the Raft member, so a changed name makes
            # every read fail with "no read replica found" after a restart. The dgx-spark overlay
            # patches in the reference cluster's original name.
            - name: CLUSTER_HOSTNAME
              value: node1
            - name: RAFT_ENABLE_ONE_NODE_RECOVERY
              value: "true"
            - name: QUERY_DEFAULTS_LIMIT
              value: "100"
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
            - name: PERSISTENCE_DATA_PATH
              value: "/var/lib/weaviate"
            - name: CLUSTER_GOSSIP_BIND_PORT
              value: "7000"
            - name: CLUSTER_DATA_BIND_PORT
              value: "7001"
            - name: RAFT_BOOTSTRAP_TIMEOUT
              value: "600"
            - name: GOGC
              value: "100"
            - name: ENABLE_MODULES
              value: "text2vec-transformers"
            - name: DEFAULT_VECTORIZER_MODULE
              value: "text2vec-transformers"
            - name: TRANSFORMERS_INFERENCE_API
              value: "http://t2v-transformers:8080"
          volumeMounts:
            - name: weaviate-data
              mountPath: /var/lib/weaviate
          livenessProbe:
            httpGet:
              path: /v1/.well-known/live
              port: 8080
            initialDelaySeconds: 900
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/.well-known/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
      volumes:
        - name: weaviate-data
          persistentVolumeClaim:
            claimName: weaviate-pvc
